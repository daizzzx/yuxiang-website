# ============================================================
# 官网自动部署流水线（CI/CD）
# 作用：每次把代码 push 到 GitHub 的 main 分支，
#       GitHub 的服务器就自动帮你做三件事：
#       1. 把代码拷下来（checkout）
#       2. 安装依赖并构建（npm ci + npm run build）
#       3. 把构建产物发布到官网（GitHub Pages）
# 全程不需要你碰任何服务器，这就是"自动化流水线"。
# ============================================================

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
